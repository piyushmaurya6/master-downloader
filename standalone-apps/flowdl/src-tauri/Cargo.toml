[package]
name = "flowdl"
version = "1.0.0"
description = "FlowDL — Modern, elegant Windows desktop video & audio downloader powered by yt-dlp and FFmpeg"
authors = ["FlowDL Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/piyushmaurya6/flowdl"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flowdl_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["process", "io-util", "sync", "time", "fs", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "gzip"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.11"
thiserror = "2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
